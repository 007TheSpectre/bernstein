# Result reads the tallies from PostgreSQL and pushes them to the
# browser over Socket.IO (websocket). Stateless, so 2 replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: poll
  labels:
    app: result
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: result
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: result
          image: localhost:5000/result:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: postgres-db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: poll
  labels:
    app: result
spec:
  selector:
    app: result
  ports:
    - name: http
      port: 80
      targetPort: 80
