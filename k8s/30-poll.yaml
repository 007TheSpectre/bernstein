# Poll is the voting page. It is stateless (the voter id lives in a
# cookie), so it runs as 2 replicas behind a ClusterIP Service.
# maxUnavailable: 0 means an update never takes the page down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poll
  namespace: poll
  labels:
    app: poll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poll
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: poll
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: poll
          image: localhost:5000/poll:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: poll
  namespace: poll
  labels:
    app: poll
spec:
  selector:
    app: poll
  ports:
    - name: http
      port: 80
      targetPort: 80
