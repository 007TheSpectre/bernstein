# Redis holds the votes queue between poll and worker.
# Auth is enabled (requirepass), the password comes from the
# redis-credentials Secret (created by deploy.sh, see README).
#
# The queue is persisted on a PVC with AOF: if redis restarts, the
# votes still waiting to be consumed are replayed instead of lost
# (workers re-read them from the log).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: poll
  labels:
    app: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: poll
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            # AOF persistence for the votes queue (see the PVC above)
            - --appendonly
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # Note: probes run through the container's shell, so use a
                # shell variable reference (${...}) — the kubelet's own
                # $(...) expansion only applies to command/args.
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: poll
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
