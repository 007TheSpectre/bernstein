# Redis holds the votes queue between poll and worker.
# Auth is enabled (requirepass), the password comes from the
# redis-credentials Secret (created by deploy.sh, see README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: poll
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # Note: probes run through the container's shell, so use a
                # shell variable reference (${...}) — the kubelet's own
                # $(...) expansion only applies to command/args.
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: poll
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
